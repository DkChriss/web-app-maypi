<div class="flex flex-col flex-auto min-w-0">
    <!-- Main -->
    <div class="flex flex-col items-center p-6 sm:p-10">
        <div class="flex flex-col w-full max-w-4xl">
            <div class="-ml-4 sm:mt-8">
                <a mat-button [routerLink]="['../']" [color]="'primary'">
                    <mat-icon
                        [svgIcon]="'heroicons_outline:arrow-long-left'"
                    ></mat-icon>
                    <span class="ml-2">Volver al Centro de Ayuda</span>
                </a>
            </div>
            <div
                class="mt-2 text-4xl sm:text-7xl font-extrabold tracking-tight leading-tight"
            >
                Guías y Recursos
            </div>
            <!-- Guides -->
            <div
                class="grid grid-cols-1 sm:grid-cols-2 grid-flow-row gap-y-12 sm:gap-x-4 mt-8 sm:mt-12"
                *ngIf="categoryGuidesList$ | async as categoryGuidesList"
            >
                <ng-container
                    *ngFor="
                        let categoryGuide of categoryGuidesList.data;
                        let i = index
                    "
                >
                    <div class="flex flex-col items-start">
                        <a
                            class="flex items-center mb-1 text-2xl font-semibold"
                        >
                            {{ categoryGuide.title }}
                        </a>
                        <ng-container
                            *ngFor="
                                let guide of categoryGuide.guides;
                                let i = index
                            "
                        >
                            <a
                                class="mt-3 font-medium hover:underline text-primary-500"
                                [routerLink]="[
                                    '/apps/help-center/guides/detail'
                                ]"
                                [queryParams]="{ id: guide.id }"
                            >
                                {{ guide.title }}
                            </a>
                        </ng-container>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</div>
