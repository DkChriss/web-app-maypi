<ng-container *ngIf="guide">
    <div class="flex flex-col flex-auto min-w-0">
        <!-- Main -->
        <div class="flex flex-col items-center p-6 sm:p-10">
            <div class="flex flex-col w-full max-w-4xl">
                <div class="-ml-4 sm:mt-8">
                    <a mat-button [routerLink]="['../']" [color]="'primary'">
                        <mat-icon
                            [svgIcon]="'heroicons_outline:arrow-long-left'"
                        ></mat-icon>
                        <span class="ml-2">Volver a titulo</span>
                    </a>
                </div>
                <div
                    class="mt-2 text-4xl sm:text-7xl font-extrabold tracking-tight leading-tight"
                >
                    {{ guide?.title }}
                </div>
                <div class="mt-1 sm:text-2xl tracking-tight text-secondary">
                    {{ guide.subtitle }}
                </div>

                <!-- Guide -->
                <div class="mt-8 sm:mt-12 max-w-none prose prose-sm">
                    {{ guide.content }}
                </div>

                <div
                    class="flex flex-col sm:flex-row sm:items-center sm:justify-between mt-10 pt-8 border-t"
                >
                    <div class="text-sm font-medium text-secondary">
                        Última actualización hace 2 meses
                    </div>
                    <div class="flex items-center mt-2 sm:mt-0">
                        <div class="font-medium text-secondary">
                            ¿Te resultó útil esta página?
                        </div>
                        <div class="ml-4">
                            <button mat-icon-button>
                                <mat-icon
                                    [svgIcon]="'heroicons_outline:thumb-up'"
                                ></mat-icon>
                            </button>
                            <button mat-icon-button>
                                <mat-icon
                                    [svgIcon]="'heroicons_outline:thumb-down'"
                                ></mat-icon>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Next -->
                <ng-container *ngIf="hasNextGuide">
                    <a
                        class="mt-8 flex items-center justify-between p-6 sm:px-10 rounded-2xl shadow hover:shadow-lg bg-card transition-shadow ease-in-out duration-150"
                        [routerLink]="['/apps/help-center/guides/detail']"
                        [queryParams]="{ id: nextGuide.id }"
                    >
                        <div>
                            <div class="text-secondary">Siguiente</div>
                            <div class="text-lg font-semibold">
                                {{ nextGuide.title }}
                            </div>
                        </div>
                        <mat-icon
                            class="ml-3"
                            [svgIcon]="'heroicons_outline:arrow-right'"
                        ></mat-icon>
                    </a>
                </ng-container>
            </div>
        </div>
    </div>
</ng-container>
