<div
    class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent"
>
    <!-- Header -->
    <div
        class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b"
    >
        <!-- Loader -->
        <div class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
            <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
        </div>
        <!-- Title -->
        <div class="text-4xl font-extrabold tracking-tight">Usuarios</div>

        <!-- Actions -->
        <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <!-- Search -->
            <mat-form-field
                class="fuse-mat-dense fuse-mat-rounded min-w-64"
                [subscriptSizing]="'dynamic'"
            >
                <mat-icon
                    class="icon-size-5"
                    matPrefix
                    [svgIcon]="'heroicons_solid:magnifying-glass'"
                ></mat-icon>
                <input
                    matInput
                    (input)="searchBy$.next($event.target.value)"
                    [autocomplete]="'off'"
                    [placeholder]="'Buscar usuario'"
                />
            </mat-form-field>

            <!-- Add Device button -->
            <button
                class="ml-4"
                mat-flat-button
                [color]="'primary'"
                (click)="store()"
            >
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Registrar nuevo usuario</span>
            </button>
        </div>
    </div>
    <!-- Main -->
    <div class="flex-auto p-6 sm:p-10">
        <div class="bg-card shadow rounded-lg overflow-hidden">
            <table mat-table [dataSource]="userList$ | async" class="w-full">
                <!-- Device Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Nombre</th>
                    <td mat-cell *matCellDef="let user">
                        {{ user.name }} {{ user.last_name }}
                    </td>
                </ng-container>

                <!-- Device ID Column -->
                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef>
                        Correo Electronico
                    </th>
                    <td mat-cell *matCellDef="let user">
                        {{ user.email }}
                    </td>
                </ng-container>

                <!--STATUS -->
                <ng-container matColumnDef="phone">
                    <th mat-header-cell *matHeaderCellDef>Telefono</th>
                    <td mat-cell *matCellDef="let user">
                        {{ user.phone }}
                    </td>
                </ng-container>
                <!-- status -->
                <ng-container matColumnDef="code">
                    <th mat-header-cell *matHeaderCellDef>Codigo</th>
                    <td mat-cell *matCellDef="let user">
                        {{ user.code }}
                    </td>
                </ng-container>
                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Acciones</th>
                    <td mat-cell *matCellDef="let user">
                        <div class="flex space-x-2">
                            <button mat-icon-button (click)="update(user)">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button (click)="delete(user.id)">
                                <mat-icon>delete</mat-icon>
                            </button>
                            <button
                                mat-icon-button
                                (click)="assignRoles(user.id)"
                            >
                                <mat-icon>key</mat-icon>
                            </button>
                            <button
                                mat-icon-button
                                (click)="assignPermissions(user.id)"
                            >
                                <mat-icon>lock</mat-icon>
                            </button>
                            <button
                                mat-icon-button
                                (click)="showInfoUser(user.id)"
                            >
                                <mat-icon>info</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr
                    mat-row
                    *matRowDef="let row; columns: displayedColumns"
                ></tr>
            </table>

            <!-- Paginación -->
            <mat-paginator
                class="sm:absolute sm:inset-x-0 sm:bottom-0 border-b sm:border-t sm:border-b-0 z-10 bg-gray-50 dark:bg-transparent"
                [ngClass]="{ 'pointer-events-none': isLoading }"
                [length]="totalItems"
                [pageIndex]="pageNumber$.value - 1"
                [pageSize]="pageSize$.value"
                [pageSizeOptions]="[5, 10, 25, 100]"
                [showFirstLastButtons]="true"
                (page)="onPageChange($event)"
            >
            </mat-paginator>

            <!-- Empty state -->
            <div
                *ngIf="(userList$ | async)?.length === 0"
                class="p-8 text-center"
            >
                <p class="text-secondary text-lg">
                    No hay usuarios registradas.
                    <br />
                    Haz clic en "Agregar usuarios" para comenzar.
                </p>
            </div>
        </div>
    </div>
</div>
